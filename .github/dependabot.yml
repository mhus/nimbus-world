# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/client" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # TS 7 is the native (Go) compiler without the classic JS API. ts-jest
      # requires <7 and vue-tsc needs the typescript/lib/tsc deep import,
      # which TS 7 no longer exports. Stay on the TS 6 bridge until Volar
      # supports TS 7 (expected with TS 7.1), see 6e6e00c1 in the history.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/server" # Location of package manifests
    schedule:
      interval: "weekly"
  # Dockerfiles sit one level below /deployment (docker-jvm, docker-ts,
  # docker-installer), and the docker ecosystem does not descend on its own.
  # Pointing it at /deployment aborted every run with "No Dockerfiles nor
  # Kubernetes YAML found in /deployment". The glob picks up each subfolder.
  - package-ecosystem: "docker"
    directories:
      - "/deployment/*"
    schedule:
      interval: "weekly"
    ignore:
      # The maven build stage runs the PMD 7 build checks, and PMD 7's java
      # parser does not support JDK 26 yet - see the comment in
      # deployment/docker-jvm/Dockerfile. The JDK lives in the tag suffix
      # (3-eclipse-temurin-25), so Dependabot proposes every new JDK major
      # (26, then 27, ...) and a version list never stays complete.
      # "3-eclipse-temurin-25" is a floating tag that already pulls maven and
      # JDK patches, so the only proposals left are JDK majors. Those must move
      # together with the graalvm runtime stages and PMD, so they are manual.
      - dependency-name: "maven"
  # Watches the `uses:` pins in .github/workflows. The directory is always "/"
  # for this ecosystem — it is the repository root, not the workflow folder.
  # Grouped into one pull request: these are all major-tag pins, so separate
  # PRs would only mean more review for the same one-line changes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
