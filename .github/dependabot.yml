# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/client" # Location of package manifests
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/server" # Location of package manifests
    schedule:
      interval: "weekly"
  # Dockerfiles sit one level below /deployment (docker-jvm, docker-ts,
  # docker-installer), and the docker ecosystem does not descend on its own.
  # Pointing it at /deployment aborted every run with "No Dockerfiles nor
  # Kubernetes YAML found in /deployment". The glob picks up each subfolder.
  - package-ecosystem: "docker"
    directories:
      - "/deployment/*"
    schedule:
      interval: "weekly"
  # Watches the `uses:` pins in .github/workflows. The directory is always "/"
  # for this ecosystem — it is the repository root, not the workflow folder.
  # Grouped into one pull request: these are all major-tag pins, so separate
  # PRs would only mean more review for the same one-line changes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
